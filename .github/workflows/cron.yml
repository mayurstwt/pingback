name: Pingback Cron
on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes (max frequency for GitHub free)
jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cron
        run: |
          curl -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
          https://your-app.vercel.app/api/cron/check-heartbeats
